name: Build FCAC.exe

# Push a tag like v1.0.0 and this builds FCAC.exe on Windows and attaches it to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name FCAC --icon fcac.ico --hidden-import pystray._win32 --collect-all SimConnect fcac.py
      - uses: actions/upload-artifact@v4
        with:
          name: FCAC
          path: dist/FCAC.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FCAC.exe
